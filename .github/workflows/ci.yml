name: CI

# Lint, typecheck and the unit suite on every push and pull request, and the
# smart-cube path replayed through the built page in headless Chrome
# (check:smart needs no model, camera or Bluetooth; check:detect needs the
# models and WebGPU, check:record a fake camera - those stay manual). The
# deploy workflow only builds; this is the gate the 1000 tests were missing
# (docs/maintenance-plan.md). Benchmarks (npm run bench) are not run here.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true' # no browser needed for this job
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  headless:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci # puppeteer fetches its Chrome here
      - run: npm run build
      - run: npm run check:smart
