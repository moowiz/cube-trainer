name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # One job, not build + deploy: the deploy job spent 5-10 s booting a second runner just to
  # hand the artifact to Pages. deploy-pages can run right after upload-pages-artifact.
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # the detector models are in Git LFS (web/.gitattributes): without this the checkout
          # leaves 132-byte pointer files and Pages serves those as facekp.onnx, so the scan
          # tab finds no model at all
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Cache the installed node_modules itself, keyed on the lockfile, and skip npm ci on a
      # hit. setup-node's `cache: npm` only keeps the tarballs, so npm ci still spent ~20 s
      # extracting and linking them on every run; restoring the folder takes a few seconds.
      - id: modules
        uses: actions/cache@v4
        with:
          path: web/node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('web/package-lock.json') }}
      - if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci
        working-directory: web
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true' # the headless checks' browser; the build needs none
      - run: npm run build
        working-directory: web
        env:
          # Project pages live at https://<user>.github.io/<repo>/
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - id: deployment
        uses: actions/deploy-pages@v4
