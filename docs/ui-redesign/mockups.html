<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ZZ trainer - redesign mockups (2026-09-26)</title>
<!--
  Static mockups for docs/ui-redesign.md. Nothing here is wired: it is the app's own palette,
  type and SVG renders (the case diagram, the 3D cube, the F2L net were lifted from the built
  page) laid out the proposed way. Each frame is a fixed phone (400 x 860) or desktop
  (1280 x 800) viewport; docs/ui-redesign/*.png are screenshots of them.
-->
<style>
  :root {
    --bg: #ECEEF2; --panel: #F7F8FA; --ink: #1B222C; --ink-2: #5A6472; --ink-3: #8A93A0; --line: #D3D8E0;
    --grey: #CBD1D9; --grey-ll: #DDE1E7; --good: #1E7A46; --good-bg: #E8F5E9; --warn: #7A4B00; --warn-bg: #FFF3D6;
    --prime: #D0342C; --two: #1E5BC6; --focus: #1B222C;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: #C4CAD3; color: var(--ink);
    font-family: "Avenir Next", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; font-feature-settings: "tnum"; }
  .board { padding: 36px; display: flex; flex-direction: column; gap: 56px; }
  .board > h1 { margin: 0; font-size: 26px; }
  .board > p { margin: -40px 0 0; max-width: 900px; color: #2a313b; line-height: 1.5; }
  .row { display: flex; flex-wrap: wrap; gap: 40px; align-items: flex-start; }
  figure { margin: 0; }
  figcaption { max-width: 400px; font-size: 14px; color: #232a33; margin-bottom: 12px; line-height: 1.45; min-height: 82px; }
  figure.wide figcaption { max-width: 1000px; min-height: 0; }
  figcaption b { display: block; font-size: 16px; margin-bottom: 3px; }

  .phone, .desk { background: var(--bg); border: 1px solid #8e97a3; overflow: hidden; position: relative; display: flex; flex-direction: column; }
  .phone { width: 400px; height: 860px; border-radius: 26px; }
  .desk { width: 1280px; height: 800px; border-radius: 10px; }

  button { font: inherit; color: inherit; }
  .sp { flex: 1; }
  .muted { color: var(--ink-2); }
  .small { font-size: 13px; }
  .tiny { font-size: 12px; color: var(--ink-2); }

  /* top bar */
  .top { display: flex; align-items: center; gap: 8px; padding: 12px 14px 10px; border-bottom: 1px solid var(--line); }
  .mode { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 6px 12px 6px 14px; font-size: 16px; font-weight: 600; }
  .mode small { font-weight: 400; color: var(--ink-2); font-size: 13px; }
  .mode i { font-style: normal; color: var(--ink-2); font-size: 12px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 5px 11px; font-size: 13px; border: 1px solid var(--line); background: var(--panel); white-space: nowrap; }
  .pill.on { background: var(--good-bg); border-color: #8BC34A; color: #1B5E20; }
  .pill.warn { background: var(--warn-bg); border-color: #E0B24B; color: var(--warn); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #43A047; display: inline-block; }
  .pill.warn .dot { background: #E0A100; }
  .ic { width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--line); background: var(--panel); display: inline-grid; place-items: center; font-size: 16px; padding: 0; }
  .ic svg { width: 18px; height: 18px; }

  /* desktop top bar */
  .dtop { display: flex; align-items: center; gap: 4px; padding: 10px 20px 0; border-bottom: 1px solid var(--line); }
  .dtop .tab { border: 0; background: none; padding: 9px 14px 11px; font-size: 15px; color: var(--ink-2); border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .dtop .tab.on { color: var(--ink); font-weight: 600; border-bottom-color: var(--ink); }
  .dtop .sep { width: 1px; height: 20px; background: var(--line); margin: 0 10px 6px; }
  .dtop .pill, .dtop .ic { margin-bottom: 7px; }
  .dtop .brand { font-weight: 700; font-size: 15px; margin-right: 18px; padding-bottom: 8px; }

  /* the stage strip: the range when idle, the progress when running */
  .strip { display: flex; gap: 3px; align-items: stretch; }
  .seg { flex: 1; min-width: 0; border-radius: 6px; background: #fff; border: 1px solid var(--line); padding: 4px 6px 3px; font-size: 11.5px; line-height: 1.2; }
  .seg b { display: block; font-weight: 600; font-size: 12px; white-space: nowrap; }
  .seg s { text-decoration: none; color: var(--ink-2); font-size: 11px; }
  .seg.wide { flex: 1.7; }
  .seg.out { background: transparent; border-style: dashed; color: var(--ink-3); }
  .seg.out s { color: var(--ink-3); }
  .seg.done { background: #E3EFE6; border-color: #A8CFB2; }
  .seg.cur { background: var(--ink); border-color: var(--ink); color: #fff; }
  .seg.cur s { color: #C9D0DA; }
  .seg.fz { box-shadow: inset 0 -3px 0 #E0A100; }
  .pips { display: inline-flex; gap: 3px; margin-left: 4px; vertical-align: 1px; }
  .pips i { width: 7px; height: 7px; border-radius: 2px; border: 1px solid currentColor; opacity: .7; }
  .pips i.on { background: currentColor; opacity: 1; }
  .strip-cap { display: flex; justify-content: space-between; font-size: 11px; color: var(--ink-2); margin: 3px 2px 0; }

  /* scramble tokens */
  .scr { display: flex; flex-wrap: wrap; justify-content: center; font-weight: 700; letter-spacing: .01em; }
  .scr span { padding: 0 .16em; margin: 0 .06em .08em; border-radius: 6px; }
  .scr .p { color: var(--prime); }
  .scr .t { color: var(--two); }
  .scr span.d { color: #9AA3AF; text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 5px; font-weight: 600; }
  .scr span.d .p, .scr span.d .t { color: #9AA3AF; }
  .scr span.nx { outline: 3px solid #E0A100; outline-offset: 1px; }
  .scr.big { font-size: 34px; line-height: 1.35; }
  .scr.mid { font-size: 22px; line-height: 1.4; }
  .scr.sm { font-size: 15px; line-height: 1.5; justify-content: flex-start; }
  .folded { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); }
  .folded .ok { color: var(--good); font-weight: 600; }

  .timer { font-weight: 300; letter-spacing: -.02em; line-height: 1; font-variant-numeric: tabular-nums; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 12px; }
  .btn { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 10px 14px; font-size: 15px; }
  .btn.pri { background: var(--ink); border-color: var(--ink); color: #fff; font-weight: 600; }
  .btn.ghost { background: transparent; }
  .chip { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 3px 10px; font-size: 12.5px; color: var(--ink-2); white-space: nowrap; }
  .chip b { color: var(--ink); font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }

  /* the phone's bottom nav */
  .nav { display: flex; border-top: 1px solid var(--line); background: var(--panel); padding: 6px 0 10px; }
  .nav a { flex: 1; text-align: center; font-size: 12px; color: var(--ink-2); display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .nav a.on { color: var(--ink); font-weight: 600; }
  .nav a svg { width: 22px; height: 22px; }

  /* the cube rail on a phone: a strip under the top bar */
  .rail-p { padding: 10px 14px 8px; border-bottom: 1px solid var(--line); background: var(--panel); }
  .body { flex: 1; display: flex; flex-direction: column; padding: 12px 16px; gap: 12px; min-height: 0; }
  .bar { display: flex; gap: 8px; padding: 10px 14px; }
  .bar .btn { flex: 1; text-align: center; }

  /* sheets */
  .scrim { position: absolute; inset: 0; background: rgba(20,22,28,.45); }
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; background: var(--bg); border-radius: 18px 18px 0 0; box-shadow: 0 -8px 30px rgba(0,0,0,.25); padding: 8px 16px 16px; }
  .grab { width: 40px; height: 5px; border-radius: 3px; background: var(--grey); margin: 0 auto 10px; }
  .sheet h3 { margin: 0; font-size: 18px; }
  .opt { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 14.5px; }
  .opt:last-child { border-bottom: 0; }
  .opt .sub { display: block; color: var(--ink-2); font-size: 12px; margin-top: 1px; }
  .seg-c { display: inline-flex; background: var(--grey-ll); border-radius: 8px; padding: 3px; gap: 2px; flex-shrink: 0; }
  .seg-c span { padding: 4px 9px; font-size: 13px; border-radius: 6px; color: var(--ink-2); white-space: nowrap; }
  .seg-c span.on { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
  .tog { width: 38px; height: 22px; border-radius: 11px; background: var(--grey); position: relative; flex-shrink: 0; }
  .tog::after { content: ""; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25); }
  .tog.on { background: var(--good); }
  .tog.on::after { left: 18px; }
  .sec-h { font-size: 11.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-2); margin: 12px 0 2px; }

  .pc { padding: 7px 9px; border-radius: 10px; background: #fff; border: 1px solid var(--line); font-size: 12px; line-height: 1.35; }
  .pc.cur { border: 2px solid var(--ink); }
  .pc.done { background: #E3EFE6; border-color: #A8CFB2; color: var(--ink-2); }
  .pc .nm { font-weight: 600; font-size: 13px; display: flex; align-items: center; gap: 4px; }
  .pc .alg { font-weight: 700; font-size: 13px; letter-spacing: .01em; }
  .sw { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }

  .stat { display: flex; gap: 14px; font-size: 13px; color: var(--ink-2); }
  .stat b { color: var(--ink); font-weight: 600; }
  table.times { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.times td { padding: 5px 4px; border-top: 1px solid var(--line); }
  table.times td.n { color: var(--ink-3); width: 26px; }
  table.times td.t { font-weight: 600; }
  table.times td.r { text-align: right; color: var(--ink-2); }

  .note { position: absolute; background: #FFF8C5; border: 1px solid #E6D46B; color: #4A3D00; font-size: 11.5px; line-height: 1.35; padding: 5px 7px; border-radius: 6px; max-width: 190px; box-shadow: 0 2px 6px rgba(0,0,0,.12); z-index: 5; }
  .note::before { content: "note"; display: block; font-weight: 700; font-size: 10px; letter-spacing: .06em; text-transform: uppercase; opacity: .6; }

  /* desktop columns */
  .cols { flex: 1; display: flex; min-height: 0; }
  .rail { width: 420px; flex-shrink: 0; border-right: 1px solid var(--line); background: var(--panel); padding: 16px 18px; display: flex; flex-direction: column; gap: 14px; }
  .focus { flex: 1; padding: 16px 24px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .drawer { width: 360px; flex-shrink: 0; border-left: 1px solid var(--line); background: var(--panel); padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
  .fhead { display: flex; align-items: center; gap: 10px; }
  .fhead h2 { margin: 0; font-size: 20px; }
  [data-svg] svg { display: block; }
  [data-svg] polygon { stroke: #2b3340; stroke-width: 1.2; stroke-linejoin: round; }
  [data-svg] polygon.solved { fill-opacity: .85; }
  [data-svg] rect { stroke: #2b3340; stroke-width: 1.2; }
  [data-svg] .ll-arrow { fill: none; stroke: #1b222c; stroke-width: 3; stroke-linecap: round; }
  [data-svg] .ll-arrow-halo { fill: none; stroke: #fff; stroke-width: 7; stroke-linecap: round; opacity: .85; }
  [data-svg] .ll-head { fill: #1b222c; stroke: #fff; stroke-width: 1.5; }
  .lbl { font-size: 11.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-2); }
</style>
</head>
<body>
<div class="board">
<h1>ZZ trainer - redesign mockups</h1>
<p>Companion to <code>docs/ui-redesign.md</code>. Static, not wired. They use the app's own palette and the SVGs the built page draws. Yellow notes explain a decision. Phone frames are 400 x 860; desktop frames are 1280 x 800.</p>

<!-- ============================ PHONE: SOLVE ============================ -->
<div class="row">

<figure id="p-solve-scr"><figcaption><b>P1 · Solve, scrambling (phone propped up)</b>The scramble is the only big thing while you apply it: it ticks along with the cube, the next turn has a box around it, and a wrong turn turns the strip amber. The strip under the top bar is the stage strip: here the range is the whole solve.</figcaption>
<div class="phone">
  <div class="top"><button class="mode">Solve <i>▾</i></button><span class="sp"></span><span class="pill on"><i class="dot"></i>GAN · 86%</span><button class="ic">⚙</button></div>
  <div class="rail-p">
    <div class="strip">
      <div class="seg cur"><b>Scr.</b><s>8/22</s></div><div class="seg"><b>EO</b></div><div class="seg"><b>Cross</b></div><div class="seg wide"><b>F2L</b><span class="pips"><i></i><i></i><i></i><i></i></span></div><div class="seg"><b>OLL</b></div><div class="seg"><b>PLL</b></div>
    </div>
  </div>
  <div class="body" style="justify-content:center;gap:20px">
    <div class="scr big" data-scr="R2 D' L2 U2 F2 L' B2 U' R F2 U2 R' D2 F L2 U B' R2 U2 F' D2 L" data-done="8"></div>
    <div class="chips" style="justify-content:center"><span class="chip">voice · <b>reads the next move</b></span><span class="chip">Show a solution</span></div>
    <div style="display:flex;align-items:center;gap:14px;justify-content:center;margin-top:8px">
      <div data-net="BDBDUBDBFRLUBRRFRBBRDUFDUBRFUUFDDDULDLLRLLFLLRFRUBFUFL" data-s="11"></div>
      <div class="tiny" style="max-width:150px">The cube as the app sees it. Tap it for the Cube panel (resync, source).</div>
    </div>
  </div>
  <div style="text-align:center;padding:4px 0 10px"><div class="timer" style="font-size:44px;color:var(--ink-3)">0.00</div><div class="tiny">starts on the first turn after the scramble</div></div>
  <div style="padding:8px 16px 10px;border-top:1px solid var(--line)"><div class="stat"><span>ao5 <b>11.52</b></span><span>ao12 <b>12.40</b></span><span>today <b>34</b></span><span class="sp"></span><span>best <b>8.91</b></span></div></div>
  <div class="nav"><a class="on" data-ico="play">Practise</a><a data-ico="book">Cases</a><a data-ico="chart">Progress</a></div>
</div></figure>

<figure id="p-solve-done"><figcaption><b>P2 · Solve, just solved</b>The same spot every mode uses for a result. The strip becomes the splits: approximate ones from the follow's stage crossings now, exact once M11's phase detection lands. The next scramble is already up top, small, and grows once you pick the cube up.</figcaption>
<div class="phone">
  <div class="top"><button class="mode">Solve <i>▾</i></button><span class="sp"></span><span class="pill on"><i class="dot"></i>GAN · 86%</span><button class="ic">⚙</button></div>
  <div class="rail-p">
    <div class="strip">
      <div class="seg done"><b>EO</b><s>1.9</s></div><div class="seg done"><b>Cross</b><s>1.4</s></div><div class="seg done wide"><b>F2L</b><s>5.1</s></div><div class="seg done"><b>OLL</b><s>1.2</s></div><div class="seg done"><b>PLL</b><s>1.8</s></div>
    </div>
  </div>
  <div class="body" style="gap:14px">
    <div><div class="tiny" style="text-align:center;margin-bottom:2px">next scramble</div><div class="scr sm" style="justify-content:center" data-scr="F2 R' U2 B2 D L2 F2 U' B2 R2 D' F L' U2 R D' B2 F' U L2" data-done="0"></div></div>
    <div style="text-align:center;margin-top:16px"><div class="timer" style="font-size:96px">11.42</div><div class="muted" style="margin-top:6px">38 turns · 3.3 tps · ao5 11.52 → <b style="color:var(--good)">11.31</b></div></div>
    <div class="bar" style="padding:6px 0"><button class="btn">+2</button><button class="btn">DNF</button><button class="btn">Note</button><button class="btn">Delete</button></div>
    <table class="times"><tbody>
      <tr><td class="n">34</td><td class="t">11.42</td><td class="r">38 · 3.3 tps · 11:02</td></tr>
      <tr><td class="n">33</td><td class="t">12.10</td><td class="r">41 · 3.4 tps · 11:01</td></tr>
      <tr><td class="n">32</td><td class="t">10.88</td><td class="r">36 · 3.3 tps · 11:00</td></tr>
      <tr><td class="n">31</td><td class="t">13.50</td><td class="r">44 · 3.3 tps · 10:59</td></tr>
    </tbody></table>
    <div class="tiny">Session <b>2026-09-26 10:40</b> · 34 solves · Progress has the graph and the rest</div>
  </div>
  <div class="nav"><a class="on" data-ico="play">Practise</a><a data-ico="book">Cases</a><a data-ico="chart">Progress</a></div>
  <div class="note" style="left:30px;top:640px;max-width:300px">Splits now: the time of each stage crossing the follow already detects (follow.ts). Exact ones (the last time a stage became true and stayed true) come with M11.</div>
</div></figure>

<figure id="p-modes"><figcaption><b>P3 · The mode picker (tap the mode chip)</b>Every mode is a <i>range</i> on the stage strip: where the scramble leaves the cube, and where the attempt ends. The tabs become presets of it, and "start in F2L, carry on through PLL" is just another row, not a tangle of follow settings.</figcaption>
<div class="phone">
  <div class="top"><button class="mode">Solve <i>▾</i></button><span class="sp"></span><span class="pill on"><i class="dot"></i>GAN · 86%</span><button class="ic">⚙</button></div>
  <div class="scrim"></div>
  <div class="sheet" style="top:60px">
    <div class="grab"></div>
    <div style="display:flex;align-items:center"><h3>Practise</h3><span class="sp"></span><span class="tiny">1-5 on a keyboard</span></div>
    <div data-modes></div>
    <div class="sec-h" style="margin-top:12px">Or set the range</div>
    <div class="opt"><span>Start from</span><span class="seg-c"><span>Scrambled</span><span class="on">Cross</span><span>Last pair</span><span>OLL</span><span>PLL</span></span></div>
    <div class="opt"><span>Stop at</span><span class="seg-c"><span>EO</span><span>Cross</span><span>F2L</span><span class="on">Solved</span></span></div>
    <div class="opt"><span>Focus<span class="sub">what the cases, stats and voice are about</span></span><span class="seg-c"><span>F2L</span><span>OLL</span><span class="on">PLL</span></span></div>
  </div>
</div></figure>

</div>

<!-- ============================ PHONE: PLL ============================ -->
<div class="row">

<figure id="p-pll-armed"><figcaption><b>P4 · PLL, the case is on the cube</b>The case is the hero; the scramble has folded to one line. The two buttons you reach for are at the bottom, above the nav, not under a page of settings. The timer sits in the same corner of the strip in every drill.</figcaption>
<div class="phone">
  <div class="top"><button class="mode">PLL <small>21 cases</small> <i>▾</i></button><span class="sp"></span><span class="pill on"><i class="dot"></i>GAN · 86%</span><button class="ic">⚙</button></div>
  <div class="rail-p">
    <div class="strip">
      <div class="seg out"><b>F2L</b></div><div class="seg out"><b>OLL</b></div><div class="seg cur fz wide"><b>PLL</b><s>case 7</s></div><div class="seg"><b>AUF</b></div>
    </div>
    <div style="display:flex;align-items:center;margin-top:8px"><div class="folded"><span class="ok">✓ scrambled</span><span>12 turns · U R2 D' R2 D R2 …</span></div><span class="sp"></span><div class="timer" style="font-size:26px">0.00</div></div>
  </div>
  <div class="body" style="align-items:center;justify-content:center">
    <div style="width:300px;height:300px" data-svg="pll-0"></div>
    <div class="chips" style="justify-content:center"><span class="chip">voice · scramble <b>read</b> · alg <b>watch</b></span><span class="chip">asks the case</span></div>
  </div>
  <div class="bar"><button class="btn">Show my note</button><button class="btn pri">Show the alg</button></div>
  <div class="nav"><a class="on" data-ico="play">Practise</a><a data-ico="book">Cases</a><a data-ico="chart">Progress</a></div>
  <div class="note" style="left:196px;top:168px">The dashed segments are outside the range: this drill starts at the PLL. Start from "Last pair" would make them solid.</div>
</div></figure>

<figure id="p-pll-done"><figcaption><b>P5 · PLL, solved</b>The result replaces the buttons: the case named, your time against your own ao5 for it, the alg you did with its chunk labels, and your note. "Next case when solved" is a countdown here, not a checkbox up the page.</figcaption>
<div class="phone">
  <div class="top"><button class="mode">PLL <small>21 cases</small> <i>▾</i></button><span class="sp"></span><span class="pill on"><i class="dot"></i>GAN · 86%</span><button class="ic">⚙</button></div>
  <div class="rail-p">
    <div class="strip">
      <div class="seg out"><b>F2L</b></div><div class="seg out"><b>OLL</b></div><div class="seg done fz wide"><b>PLL</b><s>0.9 + 1.5</s></div><div class="seg done"><b>AUF</b><s>0.2</s></div>
    </div>
    <div style="display:flex;align-items:center;margin-top:8px"><div class="folded"><span class="ok">✓ solved</span><span>14 turns</span></div><span class="sp"></span><div class="timer" style="font-size:26px">2.61</div></div>
  </div>
  <div class="body" style="align-items:stretch">
    <div style="display:flex;gap:14px;align-items:center">
      <div style="width:120px;height:120px;flex-shrink:0" data-svg="pll-0"></div>
      <div><div style="font-size:28px;font-weight:700">T perm</div><div class="muted">2.61 · your ao5 on T <b style="color:var(--good)">2.74</b> · 23 tries</div><div class="tiny" style="margin-top:4px">named right when asked</div></div>

const COL = { U: '#F5D63D', R: '#E2433C', F: '#2E6CE0', D: '#FBFBF9', L: '#F58F2A', B: '#33B15D' };
function tok(m) {
  const f = m.replace(/['2]/g, ''); let h = f;
  if (m.includes("'")) h += '<i class="p" style="font-style:normal">′</i>';
  if (m.includes('2')) h += '<i class="t" style="font-style:normal">2</i>';
  return h;
}
document.querySelectorAll('[data-scr]').forEach((el) => {

// a net in the facelet order U R F D L B, laid out as a cross
document.querySelectorAll('[data-net]').forEach((el) => {
  const f = el.dataset.net; const s = Number(el.dataset.s || 12); const g = 1; const face = 3 * s + 2 * g + 4;
  const at = { U: [1, 0], L: [0, 1], F: [1, 1], R: [2, 1], B: [3, 1], D: [1, 2] }; const order = 'URFDLB';
  let r = '';
  for (const [k, [cx, cy]] of Object.entries(at)) {
    const base = order.indexOf(k) * 9;
    for (let i = 0; i < 9; i++) {
      const x = cx * face + (i % 3) * (s + g), y = cy * face + Math.floor(i / 3) * (s + g);
      r += `<rect x="${x}" y="${y}" width="${s}" height="${s}" rx="${s / 6}" fill="${COL[f[base + i]]}" stroke="#1B222C" stroke-width=".6"/>`;
    }
  }
  el.innerHTML = `<svg width="${4 * face}" height="${3 * face}" viewBox="-1 -1 ${4 * face + 2} ${3 * face + 2}">${r}</svg>`;
});
